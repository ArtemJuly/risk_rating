services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  risk_app:
    build: .
    restart: unless-stopped
    command: >
      streamlit run risk_app.py
      --server.port=8502
      --server.address=0.0.0.0
      --server.headless=true
    expose:
      - "8502"
    environment:
      - RISK_PASSWORD=${RISK_PASSWORD:-}
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - APEX_DOMAIN=${APEX_DOMAIN}
      - RISK_DOMAIN=${RISK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - risk_app

volumes:
  caddy_data:
  caddy_config:
